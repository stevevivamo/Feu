<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feu de circulation partagé</title>
    <style>
      :root { font-family: "Segoe UI", Arial, sans-serif; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #2f9ae0 0%, #79c8f3 100%);
      }
      .wrapper {
        width: min(96vw, 1080px);
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 2vh, 24px);
      }
      .layout {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(140px, 280px) minmax(260px, 560px);
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 4vw, 52px);
      }

      .light-wrap { width: 100%; max-width: 280px; margin: 0 auto; }
      .traffic-svg {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.32));
      }
      .light-node {
        cursor: pointer;
        opacity: .35;
        transition: opacity .18s ease, transform .12s ease;
        transform-origin: center;
      }
      .light-node:hover { transform: scale(1.02); }
      .light-node.on { opacity: 1; }

      .panel {
        width: 100%;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255,255,255,0.68);
        border-radius: 14px;
        box-sizing: border-box;
        padding: clamp(12px, 1.7vw, 18px);
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: clamp(0.95rem, 1.25vw, 1.08rem);
        font-weight: 600;
        color: #1e2a3c;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: clamp(90px, 18vh, 150px);
        border: 1px solid #9eb0ca;
        border-radius: 10px;
        background: rgba(248, 251, 255, 0.95);
        padding: clamp(9px, 1.2vw, 12px);
        resize: vertical;
        font-size: clamp(0.92rem, 1.3vw, 1.03rem);
        line-height: 1.4;
      }
      textarea[readonly] { color: #25344a; }
      .actions { margin-top: 10px; display: none; gap: 10px; }
      .actions.show { display: flex; }
      button {
        border: 1px solid #98acc8;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: clamp(.86rem, 1.15vw, .95rem);
        cursor: pointer;
        background: #ffffff;
      }

      @media (max-width: 820px), (max-height: 650px) {
        .layout {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .light-wrap { max-width: min(42vw, 220px); }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="layout">
        <div class="light-wrap" aria-label="Feu de circulation">
          <svg class="traffic-svg" viewBox="0 0 325 220" role="img" aria-label="Feu rouge jaune vert">
            <image href="traffic-light.svg" x="0" y="0" width="325" height="220" />
            <g class="light-node red" data-color="red"><circle cx="88" cy="70" r="16" fill="transparent"/></g>
            <g class="light-node yellow" data-color="yellow"><circle cx="88" cy="115" r="16" fill="transparent"/></g>
            <g class="light-node green" data-color="green"><circle cx="88" cy="160" r="16" fill="transparent"/></g>
          </svg>
        </div>

        <div class="panel">
          <label for="message">Message partagé :</label>
          <textarea id="message" readonly></textarea>
          <div id="actions" class="actions">
            <button id="saveBtn" type="button">Enregistrer</button>
            <button id="cancelBtn" type="button">Annuler</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const bulbs = Array.from(document.querySelectorAll('.light-node'));
      const messageArea = document.getElementById('message');
      const actions = document.getElementById('actions');
      const saveBtn = document.getElementById('saveBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      let currentState = { color: 'red', message: '' };
      let draftMessage = '';
      let isEditing = false;

      function render() {
        bulbs.forEach((bulb) => bulb.classList.toggle('on', bulb.dataset.color === currentState.color));
        messageArea.value = currentState.message || '';
      }

      function setEditMode(enabled) {
        isEditing = enabled;
        messageArea.readOnly = !enabled;
        actions.classList.toggle('show', enabled);
        if (enabled) {
          draftMessage = currentState.message || '';
          messageArea.focus();
        }
      }

      async function loadState() {
        if (isEditing) return;
        const res = await fetch('state.aspx');
        currentState = await res.json();
        render();
      }

      async function saveState(nextState) {
        const res = await fetch('state.aspx', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nextState)
        });
        currentState = await res.json();
        render();
      }

      bulbs.forEach((bulb) => {
        bulb.addEventListener('click', async (event) => {
          if (!event.shiftKey) return;
          await saveState({ ...currentState, color: bulb.dataset.color });
        });
      });

      messageArea.addEventListener('click', (event) => {
        if (event.shiftKey) setEditMode(true);
      });

      saveBtn.addEventListener('click', async () => {
        await saveState({ ...currentState, message: messageArea.value });
        setEditMode(false);
      });

      cancelBtn.addEventListener('click', () => {
        messageArea.value = draftMessage;
        setEditMode(false);
      });

      loadState();
      setEditMode(false);
      setInterval(() => {
        if (!isEditing) loadState();
      }, 2000);
    </script>
  </body>
</html>
